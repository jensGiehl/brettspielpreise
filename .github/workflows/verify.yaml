name: Verify without publication
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: '27'
      - name: Install matching Chromium
        run: mvn --strict-checksums -B -ntp compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI '-Dexec.args=install --with-deps chromium'
      - name: Allow Chromium sandbox user namespaces on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify Java and real browser fixtures
        env:
          RUN_BROWSER_TESTS: 'true'
          DEBUG: pw:browser
        run: mvn --strict-checksums -B -ntp -Ddebug=false clean verify
      - name: Verify restricted IPv6 proxy
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
  container:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: bg-prices:ci
      - name: Chromium, sandbox, JavaScript, volume and cache restart smoke
        run: |
          mkdir -p data
          sudo chown 10001:10001 data
          docker run --rm --init --platform '${{ matrix.platform }}' \
            --shm-size=256m --security-opt seccomp=./docker/seccomp_profile.json \
            --mount "type=bind,source=$(pwd)/data,target=/app/data" \
            --entrypoint java bg-prices:ci \
            -Dloader.main=de.agiehl.bgprices.browser.BrowserSmoke \
            -cp /app/bg-prices.jar org.springframework.boot.loader.launch.PropertiesLauncher
      - name: HTTP readiness and restart
        run: |
          docker run -d --name bg-prices-ci --init --shm-size=256m \
            --security-opt seccomp=./docker/seccomp_profile.json \
            -p 18090:8080 --mount "type=bind,source=$(pwd)/data,target=/app/data" bg-prices:ci
          trap 'docker logs bg-prices-ci; docker rm -f bg-prices-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18090/actuator/health/readiness; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18090/actuator/health/readiness
          curl -fsSG --data-urlencode 'name=(fixture)' http://127.0.0.1:18090/api/v1/prices
          docker restart --timeout 65 bg-prices-ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18090/actuator/health/readiness; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18090/actuator/health/readiness
